name: 无密钥网页搜索可行性实验
on:
  pull_request:
    branches: [main]
    paths:
      - "research/keyless_probe.py"
      - ".github/workflows/keyless-research-ci.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出实验程序
        uses: actions/checkout@v4
      - name: Python运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装公开搜索SDK
        run: python -m pip install tavily-python
      - name: 执行公开商品评测搜索实验
        run: python research/keyless_probe.py
      - name: 上传匿名化来源报告
        uses: actions/upload-artifact@v4
        with:
          name: 免费无密钥网页搜索实验
          path: output/keyless_search_probe.json
          retention-days: 14
