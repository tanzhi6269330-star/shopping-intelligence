name: 免费浏览器联网评测试验
on:
  workflow_dispatch:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: 下载代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装Selenium
        run: python -m pip install selenium
      - name: 启动测试网页
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/shopping-cors.log 2>&1 &
          sleep 2
      - name: 在真实Chrome内测试Tavily无密钥联网搜索
        run: python tests/browser_keyless_probe.py
