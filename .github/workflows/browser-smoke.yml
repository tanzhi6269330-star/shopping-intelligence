name: 在线网页浏览器验收
on:
  workflow_run:
    workflows: ["测试并发布中文购物网站"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 检出网站代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装浏览器测试组件
        run: python -m pip install selenium
      - name: 启动独立本地网页服务
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/shopping-http.log 2>&1 &
          sleep 2
      - name: 执行本地页面交互验收
        run: python tests/browser_smoke.py
      - name: 执行已发布网址的在线交互验收
        env:
          SHOPPING_SITE_URL: https://tanzhi6269330-star.github.io/shopping-intelligence/
        run: python tests/browser_smoke.py
      - name: 对话购物首页本地多轮验收
        run: python tests/chat_browser_smoke.py
      - name: 对话购物正式网址多轮验收
        env:
          SHOPPING_SITE_URL: https://tanzhi6269330-star.github.io/shopping-intelligence/
        run: python tests/chat_browser_smoke.py
      - name: WorkOS 本地页面交互验收
        run: python tests/workos_browser_smoke.py
      - name: WorkOS 已发布网址交互验收
        env:
          SHOPPING_SITE_URL: https://tanzhi6269330-star.github.io/shopping-intelligence/
        run: python tests/workos_browser_smoke.py
