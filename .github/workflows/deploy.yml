name: 测试并发布中文购物网站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shopping-pages
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 测试中文网页
        run: node --test tests/*.test.mjs
      - name: 准备网站文件
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -R chat dist/chat
          cp -R classic dist/classic
          cp -R workos dist/workos
          touch dist/.nojekyll
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: test-and-package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署网站
        id: deployment
        uses: actions/deploy-pages@v4
