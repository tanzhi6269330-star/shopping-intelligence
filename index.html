<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="对话式智能购物助手"><title>智能购物研究助手｜对话选购</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#193441;background:#f5f8f9}*{box-sizing:border-box}body{margin:0}header{padding:20px 4%;background:#fff;border-bottom:1px solid #e2e9ed;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}header a,a{color:#087589}main{max-width:1100px;margin:25px auto;padding:0 18px}h1{font-size:clamp(25px,4vw,36px);margin:0 0 10px}p{line-height:1.65}h2{font-size:17px}.desc{color:#6d828d;margin:0 0 20px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:18px}.box{border:1px solid #e0e9ec;background:white;border-radius:16px;box-shadow:0 8px 20px #26455408}.chat{min-height:570px;display:flex;flex-direction:column}.history{padding:18px;flex:1;max-height:580px;min-height:340px;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{border-radius:13px;padding:13px;line-height:1.65;font-size:14px;white-space:pre-wrap;max-width:94%}.assistant{background:#edf5f6;align-self:flex-start}.user{background:#117b88;color:white;align-self:flex-end}.quick{padding:10px 15px;display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #d1dfe4;border-radius:999px;background:white;color:#456778;padding:7px 11px;font-size:12px;cursor:pointer}form{display:flex;padding:15px;gap:10px;border-top:1px solid #e9eff0}textarea{flex:1;min-height:57px;resize:vertical;border:1px solid #cedce1;border-radius:10px;padding:12px;font:inherit}button.send{background:#107889;border:0;color:white;border-radius:10px;font-weight:700;padding:0 20px;cursor:pointer}.side{display:flex;flex-direction:column;gap:15px}.side .box{padding:17px}.tag{font-size:12px;background:#ecf4f5;color:#356979;display:inline-block;border-radius:6px;margin:3px;padding:6px}.candidate{border:1px solid #e5eef0;border-radius:10px;padding:13px;margin:12px 0}.candidate strong{font-size:14px}.candidate p{font-size:12px;color:#607987;margin:7px 0}.candidate a{font-size:12px;margin-right:10px}.note{font-size:12px;color:#856729;background:#fff8e7;padding:13px;border-radius:9px;line-height:1.7}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.links a{font-size:12px;background:#eef5f7;padding:7px 9px;border-radius:7px;text-decoration:none}.muted{font-size:12px;color:#738a96;line-height:1.6}.reset{background:#fff;border:1px solid #d3e0e5;border-radius:7px;padding:8px 10px;cursor:pointer;margin-top:10px}@media(max-width:780px){.layout{grid-template-columns:1fr}.history{max-height:480px}header{gap:12px;flex-wrap:wrap}}
</style></head><body><header><b>智能购物研究助手</b><a href="./classic/">旧版商品核验台</a></header><main><h1>你说想买什么，我来逐步缩小范围。</h1><p class="desc">直接聊天，自动记住预算、用途、品牌和二手偏好；先研究值得买的型号，再寻找各平台报价。</p><div class="layout">
<section class="box chat"><div id="history" class="history" aria-live="polite"></div><div id="quick" class="quick"></div><form id="chat-form"><textarea id="message" placeholder="例如：找个100元以内、带麦克风的游戏耳机" maxlength="600" aria-label="购物需求"></textarea><button type="submit" class="send">发送</button></form></section>
<aside class="side"><div class="box"><h2>当前条件</h2><div id="constraints" class="muted">说一句购物需求即可开始。</div><button id="reset" class="reset" type="button">清空本轮对话</button></div><div class="box"><h2>品牌和型号推荐研究</h2><div id="picks" class="muted">开始对话后，根据评测证据显示型号候选。</div></div><div class="box"><h2>评测及跨平台搜索</h2><div class="note">当前为免费的基础对话原型：能保留条件、追问、展示有出处的部分型号建议，但尚未接入在线大模型及实时电商搜索。所有商品价格需另外核验，不会编造实时到手价。</div><div class="links" id="links"></div></div></aside></div><p class="muted">对话数据仅保存在当前浏览器。购物前请核对规格、到手价、售后；1688注意起订量、闲鱼注意成色、盼之注意实名换绑与找回风险。</p></main><script type="module">
const el=x=>document.querySelector(x),STORE="shopping-chat-v1";
const init=()=>({category:"",budget:null,brand:"",used:null,mic:null,wireless:null,purpose:"",platform:"",excluded:[],messages:[]});
let state=init();try{const v=JSON.parse(localStorage.getItem(STORE)||"null");if(v&&Array.isArray(v.messages)&&v.messages.length<=60)state=Object.assign(init(),v)}catch{}
const sources={
rtings:{title:"RTINGS 2026年10月预算游戏耳机评测",url:"https://www.rtings.com/headphones/reviews/best/gaming-headsets-under-50"},
toms:{title:"Tom's Hardware 2026年10月游戏耳机评测",url:"https://www.tomshardware.com/peripherals/gaming-headsets/best-gaming-headsets"}};
const products=[
{brand:"HyperX",model:"Cloud III 有线",note:"专业评测认可舒适性与基础游戏表现，需核验国内版本和售价。",src:["rtings","toms"]},
{brand:"SteelSeries",model:"Arctis Nova 1",note:"入门有线游戏耳机，作为对照研究，需核验国内渠道和售后。",src:["toms"]},
{brand:"Turtle Beach",model:"Atlas 200",note:"轻量化有线游戏耳机，国内在售与具体版本尚未确认。",src:["toms"]}];
const brands={金士顿:"HyperX",赛睿:"SteelSeries",乌龟海岸:"Turtle Beach"};
function node(tag,cl,txt){const x=document.createElement(tag);if(cl)x.className=cl;if(txt!==undefined)x.textContent=txt;return x}
function anchor(name,url){const a=node("a","",name);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a}
function typeOf(s){if(/耳机|耳麦|headset/i.test(s))return "耳机";if(/王者荣耀账号|游戏账号|代售账号/.test(s))return "游戏账号";if(/笔记本|电脑|主机/.test(s))return "电脑";if(/手机|平板/.test(s))return "手机";if(/键盘|鼠标/.test(s))return "外设";if(/洗衣机|冰箱|空调/.test(s))return "家电";return ""}
function budgetOf(s){const m=s.match(/(?:预算|以内|低于|不超过|最多|上限|降到|便宜到|控制在)\s*(\d+(?:\.\d+)?)\s*(千|万|元|块)?|(\d+(?:\.\d+)?)\s*(千|万|元|块)\s*(?:左右|以内|以下|封顶)/);if(m){const n=Number(m[1]||m[3]);const unit=m[2]||m[4];const val=n*(unit==="千"?1000:unit==="万"?10000:1);if(val>0&&val<1e7)return val}const x=s.match(/(\d+(?:\.\d+)?)\s*(?:元|块)?\s*(?:以内|以下)/);if(x)return Number(x[1]);return null}
function absorb(t){
 const cat=typeOf(t);if(cat)state.category=cat;
 const b=budgetOf(t);if(b!==null)state.budget=b;else if(/再便宜点|便宜点|降低预算/.test(t)&&state.budget)state.budget=Math.max(10,Math.round(state.budget*.75/10)*10);
 if(/不要二手|只要全新|不考虑二手|排除二手/.test(t))state.used=false;else if(/二手也行|接受二手|闲鱼也可以/.test(t))state.used=true;
 if(/不需要麦|不用麦|不要麦/.test(t))state.mic=false;else if(/麦克风|带麦|开黑|语音/.test(t))state.mic=true;
 if(/只要无线|必须无线|蓝牙连接/.test(t))state.wireless=true;else if(/有线就行|只要有线|不考虑无线/.test(t))state.wireless=false;
 if(/游戏|电竞|开黑/.test(t))state.purpose="游戏";else if(/听歌|音乐|通勤/.test(t))state.purpose="音乐/通勤";
 if(/不限品牌|其他品牌|换个品牌|品牌不限/.test(t))state.brand="";
 const m=t.match(/(?:只要|指定|优先|想看)(?:品牌)?\s*(HyperX|金士顿|雷蛇|Razer|Sony|索尼|华为|小米|赛睿|SteelSeries|Turtle Beach)/i);if(m)state.brand=brands[m[1]]||m[1];
 const ex=t.match(/(?:不要|排除)(HyperX|金士顿|雷蛇|Razer|索尼|华为|小米|赛睿|SteelSeries|Turtle Beach)/i);if(ex)state.excluded.push(brands[ex[1]]||ex[1]);
 const p=t.match(/闲鱼|1688|盼之代售|京东|淘宝|天猫|拼多多/);if(p)state.platform=p[0]==="天猫"?"淘宝":p[0];
}
function candidates(){
 if(state.category!=="耳机"||state.wireless===true)return [];
 return products.filter(p=>(!state.brand||p.brand.toLowerCase()===state.brand.toLowerCase())&&!state.excluded.some(x=>p.brand.toLowerCase()===x.toLowerCase()));
}
function question(){
 if(!state.category)return "你想买什么？可以直接描述用途和预算。";
 if(state.category==="耳机"){if(!state.purpose)return "主要打游戏还是听歌通勤？";if(state.budget===null)return "预算大概多少？例如50元以内、100元左右。";if(state.mic===null)return "需要麦克风进行语音通话吗？";if(state.wireless===null)return "需要无线，还是有线也可以？"}
 if(state.category==="游戏账号")return "先确认游戏、区服、预算和看重的皮肤/等级，再独立核验实名与换绑风险。";
 if(state.budget===null)return "预算大概多少？";return "有什么必须具备或无法接受的功能吗？";
}
function response(){
 const picks=candidates();let msg="";
 if(state.category==="耳机"&&picks.length){msg="当前可参考的专业评测型号："+picks.map(x=>x.brand+" "+x.model).join("、")+"。它们仅是研究候选，不代表适合你在国内的预算或已找到商品现价。评测出处见右侧。";}
 else if(state.category==="耳机"&&state.wireless===true)msg="你要求无线，已排除已有的有线评测候选；待检索新的无线产品证据，不会硬凑推荐。";
 else msg="条件已记住。当前这一品类尚无经过审核的型号证据库，会保留检索入口而不会编造高性价比品牌排名。";
 return msg+"\n\n"+question();
}
function search(platform,q){const x=encodeURIComponent(q);if(platform==="京东")return "https://search.jd.com/Search?keyword="+x;if(platform==="淘宝")return "https://s.taobao.com/search?q="+x;if(platform==="闲鱼")return "https://www.goofish.com/search?q="+x;if(platform==="1688")return "https://www.1688.com/";if(platform==="拼多多")return "https://www.pinduoduo.com/";return "https://www.pzds.com/"}
function draw(){
 const hist=el("#history");hist.replaceChildren();if(!state.messages.length)hist.append(node("div","msg assistant","你好。随口说说你想买什么，例如“帮我找一个100元以内、带麦克风的游戏耳机”。我会自动提炼条件，并询问会影响结果的关键细节。"));
 for(const m of state.messages)hist.append(node("div","msg "+m.role,m.text));hist.scrollTop=hist.scrollHeight;
 const c=el("#constraints");c.replaceChildren();if(!state.category)c.textContent="尚未开始。";
 else{const info=[["品类",state.category],["预算",state.budget===null?"不限":"¥"+state.budget],["用途",state.purpose||"待确认"],["麦克风",state.mic===null?"待确认":state.mic?"需要":"不需要"],["连接",state.wireless===null?"未限定":state.wireless?"无线":"有线"],["二手",state.used===null?"未限定":state.used?"允许":"排除"],["品牌",state.brand||"不指定"],["平台",state.platform||"不限"]];for(const [k,v] of info)c.append(node("span","tag",k+"："+v))}
 const p=el("#picks");p.replaceChildren();const opts=candidates();if(!opts.length)p.append(node("p","muted","目前没有符合条件的已审核型号。对其他品类将先寻找真实评测，不输出虚构榜单。"));else{for(const item of opts){const box=node("div","candidate");box.append(node("strong","",item.brand+" "+item.model),node("p","",item.note));for(const source of item.src)box.append(anchor("评测："+sources[source].title,sources[source].url));p.append(box)}p.append(node("p","muted","评测型号不代表国内价格、SKU或购买渠道已经核验。"))}
 const links=el("#links");links.replaceChildren();if(state.category){const q=(opts.length?opts[0].brand+" "+opts[0].model:state.category);links.append(anchor("更多评测","https://www.bing.com/search?q="+encodeURIComponent(q+" 测评 横评 性价比")));for(const name of ["京东","淘宝","拼多多","1688","闲鱼","盼之代售"])if(!state.platform||name===state.platform)links.append(anchor(name+"搜索",search(name,q)))}
 const quick=el("#quick");quick.replaceChildren();for(const t of (state.category?["再便宜点","不要二手","看看其他品牌","只要无线"]:["百元内带麦游戏耳机","找一款高性价比电脑","想买王者荣耀账号"])){const b=node("button","chip",t);b.type="button";b.addEventListener("click",()=>send(t));quick.append(b)}
}
function send(text){const t=String(text).trim().slice(0,600);if(!t)return;state.messages.push({role:"user",text:t});absorb(t);state.messages.push({role:"assistant",text:response()});state.messages=state.messages.slice(-60);try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}draw()}
el("#chat-form").addEventListener("submit",e=>{e.preventDefault();send(el("#message").value);el("#message").value=""});
el("#message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();el("#chat-form").requestSubmit()}});
el("#reset").addEventListener("click",()=>{if(confirm("清空对话及购物条件？")){state=init();localStorage.removeItem(STORE);draw()}});
draw();
</script></body></html>
